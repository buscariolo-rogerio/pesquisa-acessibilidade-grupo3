services:
  app:
    build: .
    container_name: nodejs-app
    ports:
      - "${PORT}:${PORT}"
    env_file:
      - .env
    depends_on:
      - banco

  banco:
    image: postgres:17-alpine
    container_name: nodejs-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: